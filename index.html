<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Alchemist's Portfolio</title>
    <link rel="icon" type="image/png" href="sigil.png">
    <meta property="og:image" content="sigil.png">
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts for esoteric headers and clean financial data -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grimoire-container">
        <header>
            <h1 class="esoteric-title">Arcana Portfolio</h1>
            <p class="subtitle">Transmuting Capital into Wealth</p>
        </header>

        <main class="alchemy-grid">
            <!-- Centerpiece: Ouroboros -->
            <div class="symbol-card ouroboros-center" data-metric="Total AUM: $1.2M | APY: 14.5%">
                <div class="svg-container">
                    <svg class="ouroboros" viewBox="0 0 200 200" aria-hidden="true">
                        <circle class="halo" cx="100" cy="100" r="80" fill="none" stroke="currentColor" stroke-width="1" opacity="0.12"/>
                        <circle class="scales" cx="100" cy="100" r="68" fill="none" stroke="currentColor" stroke-width="1.2"
                                opacity="0.6" pathLength="100" stroke-dasharray="0.8 4.8" stroke-linecap="round"/>
                        <path d="M 117.6 34.3 A 68 68 0 0 1 165.7 82.4" fill="none" stroke="currentColor" stroke-width="10.5"/>
                        <path d="M 165.7 82.4 A 68 68 0 0 1 148.1 148.1" fill="none" stroke="currentColor" stroke-width="9.5"/>
                        <path d="M 148.1 148.1 A 68 68 0 0 1 82.4 165.7" fill="none" stroke="currentColor" stroke-width="8.4"/>
                        <path d="M 82.4 165.7 A 68 68 0 0 1 34.3 117.6" fill="none" stroke="currentColor" stroke-width="7.2"/>
                        <path d="M 34.3 117.6 A 68 68 0 0 1 51.9 51.9" fill="none" stroke="currentColor" stroke-width="6"/>
                        <path d="M 51.9 51.9 A 68 68 0 0 1 82.4 34.3" fill="none" stroke="currentColor" stroke-width="4.8"/>
                        <path class="tail-in" d="M 82.4 34.3 q 9 7 15 7" fill="none" stroke="currentColor" stroke-width="4"/>
                        <circle class="head" cx="100" cy="31" r="11" fill="currentColor"/>
                        <circle class="eye" cx="103.2" cy="28.6" r="3" fill="#14140f"/>
                        <path class="jaw-top" d="M 89.8 33 q 9 7 12.2 8.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                        <path class="jaw-low" d="M 110.2 33 q -9 7 -12.2 8.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                    </svg>
                </div>
                <h2>The Magnum Opus</h2>
            </div>

            <!-- Elements Grid -->
            <div class="elements-container">
                <div class="element-node fire" data-asset="AI Equities" data-allocation="40%">
                    <div class="svg-container">
                        <svg viewBox="0 0 100 100" aria-hidden="true">
                            <polygon points="50,16 84,78 16,78" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>
                <div class="element-node earth" data-asset="Commodities" data-allocation="25%">
                    <div class="svg-container">
                        <svg viewBox="0 0 100 100" aria-hidden="true">
                            <polygon points="50,84 16,22 84,22" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
                            <line x1="30" y1="52" x2="70" y2="52" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>
                <div class="element-node water" data-asset="Liquidity" data-allocation="15%">
                    <div class="svg-container">
                        <svg viewBox="0 0 100 100" aria-hidden="true">
                            <polygon points="50,84 16,22 84,22" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>
                <div class="element-node air" data-asset="Fixed Income" data-allocation="20%">
                    <div class="svg-container">
                        <svg viewBox="0 0 100 100" aria-hidden="true">
                            <polygon points="50,16 84,78 16,78" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
                            <line x1="30" y1="48" x2="70" y2="48" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>
            </div>
        </main>

        <div id="tooltip" class="mystic-tooltip hidden">
            <!-- JS will populate this with financial data on hover -->
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>

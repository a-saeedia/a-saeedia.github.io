<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Alchemist's Portfolio</title>
    <link rel="icon" type="image/png" href="sigil.png">
    <meta property="og:image" content="sigil.png">
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts for esoteric headers and clean financial data -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grimoire-container">
        <header>
            <h1 class="esoteric-title">Arcana Portfolio</h1>
            <p class="subtitle">Transmuting Capital into Wealth</p>
        </header>

        <main class="alchemy-grid">
            <!-- Centerpiece: Ouroboros -->
            <div class="symbol-card ouroboros-center" data-metric="Total AUM: $1.2M | APY: 14.5%">
                <div class="svg-container">
                    <svg class="ouroboros" viewBox="0 0 200 200" aria-hidden="true">
                        <circle class="halo" cx="100" cy="100" r="76" fill="none" stroke="currentColor" stroke-width="1" opacity="0.10"/>
                        <circle class="ring" cx="100" cy="100" r="70" fill="none" stroke="currentColor" stroke-width="6"
                                pathLength="100" stroke-dasharray="87 13" stroke-linecap="round"/>
                        <circle class="ring-inner" cx="100" cy="100" r="56" fill="none" stroke="currentColor" stroke-width="1"
                                opacity="0.35" pathLength="100" stroke-dasharray="58 42" stroke-linecap="round"/>
                        <circle class="eye" cx="146" cy="84" r="3.4" fill="currentColor"/>
                        <path class="jaw" d="M140 92 q 12 4 8 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path class="tail" d="M60 92 q -10 -2 -12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <h2>The Magnum Opus</h2>
            </div>

            <!-- Elements Grid -->
            <div class="elements-container">
                <div class="element-node fire" data-asset="AI Equities" data-allocation="40%">
                    <div class="svg-container">
                        <svg viewBox="0 0 100 100" aria-hidden="true">
                            <polygon points="50,16 84,78 16,78" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>
                <div class="element-node earth" data-asset="Commodities" data-allocation="25%">
                    <div class="svg-container">
                        <svg viewBox="0 0 100 100" aria-hidden="true">
                            <polygon points="50,84 16,22 84,22" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
                            <line x1="30" y1="52" x2="70" y2="52" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>
                <div class="element-node water" data-asset="Liquidity" data-allocation="15%">
                    <div class="svg-container">
                        <svg viewBox="0 0 100 100" aria-hidden="true">
                            <polygon points="50,84 16,22 84,22" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>
                <div class="element-node air" data-asset="Fixed Income" data-allocation="20%">
                    <div class="svg-container">
                        <svg viewBox="0 0 100 100" aria-hidden="true">
                            <polygon points="50,16 84,78 16,78" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
                            <line x1="30" y1="48" x2="70" y2="48" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>
            </div>
        </main>

        <div id="tooltip" class="mystic-tooltip hidden">
            <!-- JS will populate this with financial data on hover -->
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
